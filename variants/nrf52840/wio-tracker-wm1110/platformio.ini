; The red tracker Dev Board with the WM1110 module
[env:wio-tracker-wm1110]
custom_meshtastic_hw_model = 21
custom_meshtastic_hw_model_slug = WIO_WM1110
custom_meshtastic_architecture = nrf52840
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = Seeed Wio WM1110 Tracker
custom_meshtastic_images = wio-tracker-wm1110.svg
custom_meshtastic_tags = Seeed
custom_meshtastic_requires_dfu = true

extends = nrf52840_base
board_level = release
board = wio-tracker-wm1110
build_flags = ${nrf52840_base.build_flags}
  -Ivariants/nrf52840/wio-tracker-wm1110
  -Isrc/platform/nrf52/softdevice
  -Isrc/platform/nrf52/softdevice/nrf52
  -DWIO_WM1110
board_build.ldscript = src/platform/nrf52/nrf52840_s140_v7.ld
build_src_filter = ${nrf52_base.build_src_filter} +<../variants/nrf52840/wio-tracker-wm1110>
; If not set we will default to uploading over serial (first it forces bootloader entry by talking 1200bps to cdcacm)
;upload_protocol = jlink

lib_ignore = NHD ST7789

; Always-powered V9 LCD bench assembly; rotary must remain disconnected.
[env:wio-tracker-wm1110-st7789-bench]
extends = env:wio-tracker-wm1110
board_level = extra
custom_meshtastic_display_name = Seeed Wio WM1110 Tracker ST7789 Bench
build_flags = ${env:wio-tracker-wm1110.build_flags}
  -DWIO_ST7789_LCD_BENCH
  ; Dev board only: rotary conflicts with LCD pins there (P0.14/P0.15); custom board uses 9/10/16.
  -DWIO_NO_ROTARY
lib_ignore =
lib_deps = ${nrf52840_base.lib_deps}
  NHD ST7789

; First custom-board bring-up: no UF2 bootloader; this S140 7.3.0 build forwards to 0x27000
; (literal at SD 0x25E04), so the stock 0x27000 link base is correct without a bootloader.
[env:wio-tracker-wm1110-st7789-bringup]
extends = env:wio-tracker-wm1110-st7789-bench
board_level = extra
custom_meshtastic_display_name = träckthäspäck Bring-up
; Debug build: keep real function bodies so SEGGER breakpoints resolve (LTO inlines
; them otherwise). SoftDevice use stays runtime-managed (BLE compiled in, enabled by
; config); no bootloader on these boards, so ignore the inherited DFU/UF2 metadata.
build_unflags = ${nrf52840_base.build_unflags} -flto
build_flags = ${env:wio-tracker-wm1110.build_flags}
  -DWIO_ST7789_LCD_BENCH
  -DWIO_CUSTOM_ROTARY
  -DWIO_LCD_PWR_GATE
  -DHAS_BUTTON=0
  -std=gnu++17
